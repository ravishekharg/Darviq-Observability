# Single-binary Loki with local storage: right for one host. For a cluster, the same LogQL,
# dashboards and rules work against Loki in microservices mode or Grafana Cloud Logs.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
  storage:
    filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

limits_config:
  retention_period: 168h          # a week of logs
  allow_structured_metadata: true
  discover_log_levels: true       # adds detected_level (error, warn, info...) to every line

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Log-based alerts go to the same Alertmanager as the metric alerts.
ruler:
  storage:
    type: local
    local: {directory: /etc/loki/rules}
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  evaluation_interval: 1m
