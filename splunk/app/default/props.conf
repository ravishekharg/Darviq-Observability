# Container log lines arrive from Alloy (splunk.alloy) through the HTTP Event Collector, with
# project, service and container as indexed fields. The level is worked out at search time,
# the way Loki's detected_level works, since every app logs in its own format.
#
# A level the line states itself wins: level=info, "level": "error", "severity": "warning",
# Python's "INFO:" and "[ERROR]". Only lines without one fall back to keywords. Keywords alone
# got it wrong: Alloy logs failed retries as level=info ... error="connection refused", and the
# on-call receiver's log of an "Error log spike" alert contains the word Error, so both counted
# as errors and the first alert ever raised was a false one.
[docker:container]
EXTRACT-explicit_level = (?i)(?:\b(?:level|lvl|severity)["']?\s*[=:]\s*["']?|^\s*\[?)(?<explicit_level>trace|debug|info|notice|warn|warning|err|error|crit|critical|fatal|panic|emerg|alert)\b
EVAL-level = case(match(explicit_level, "(?i)^(crit|critical|fatal|panic|emerg|alert)$"), "critical", match(explicit_level, "(?i)^(err|error)$"), "error", match(explicit_level, "(?i)^warn"), "warning", isnotnull(explicit_level), "info", match(_raw, "(?i)\b(fatal|critical|panic|emerg)\b|\[crit\]"), "critical", match(_raw, "(?i)\b(error|err)\b|traceback \(most recent call last\)"), "error", match(_raw, "(?i)\b(warn|warning)\b"), "warning", true(), "info")
