# The same two log alerts as Loki's (loki/rules/fake/log-alerts.yml), as Splunk scheduled
# searches. Each sends a webhook to the shared on-call page (alert-receiver, POST /splunk).
#
# Splunk alerts are events, not states: they say "this happened", and there is no "resolved"
# notice when it stops. Suppression stops the same service paging again every minute while
# the problem lasts.
#
# The monitoring components that log *about* alerts are left out: Splunk and Loki log their
# searches' text (Loki's crash rule contains "Traceback (most recent call last)"), and the
# on-call receiver logs every notification with its severity, so a burst of critical alerts
# looked like a burst of critical log lines and raised another alert. Found in a drill.

[Darviq - Error log spike]
description = A service logged more than 20 error lines in 5 minutes. Runbook: docs/runbooks.md#errorlogspike
search = index=darviq_logs service=* NOT service IN (splunk, loki, alert-receiver) level IN (error, critical) \
| stats count by project service \
| where count > 20 \
| eval severity="warning", summary=service." (".project.") logged ".count." errors in 5 minutes"
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
# One notification per service that crosses the line, not one per search run.
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = project,service
alert.suppress.period = 30m
actions = webhook
action.webhook = 1
action.webhook.param.url = http://alert-receiver:9099/splunk

[Darviq - Crash in logs]
description = A service logged a crash (Python traceback, unhandled exception or Go panic) more than 3 times in 10 minutes. Runbook: docs/runbooks.md#crashloopinlogs
search = index=darviq_logs service=* NOT service IN (splunk, loki, alert-receiver) ("Traceback (most recent call last)" OR "unhandled exception" OR "panic:") \
| stats count by project service \
| where count > 3 \
| eval severity="critical", summary=service." (".project.") logged ".count." crashes in 10 minutes"
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = project,service
alert.suppress.period = 30m
actions = webhook
action.webhook = 1
action.webhook.param.url = http://alert-receiver:9099/splunk
