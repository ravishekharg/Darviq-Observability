# Scrapes the same Prometheus endpoints as Prometheus does, so Datadog sees identical
# request, error and latency metrics (as darviq.http.requests.count etc., tagged by service).
init_config:

instances:
  - openmetrics_endpoint: http://host.docker.internal:5000/metrics
    namespace: darviq
    metrics:
      - http_requests: http.requests
      - http_request_duration_seconds: http.request.duration
    tags: ["product:darviq-buzz"]

  - openmetrics_endpoint: http://host.docker.internal:5001/metrics
    namespace: darviq
    metrics:
      - http_requests: http.requests
